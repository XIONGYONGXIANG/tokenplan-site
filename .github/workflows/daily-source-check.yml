name: Daily Source Check

on:
  schedule:
    - cron: "17 */4 * * *" # 每 4 小时检查一次
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Cache source fingerprints
        uses: actions/cache@v4
        with:
          path: .cache/source-fingerprints.json
          key: source-fingerprints-${{ github.run_id }}
          restore-keys: |
            source-fingerprints-

      - name: Check sources
        run: npm run check:sources
