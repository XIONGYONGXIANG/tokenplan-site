name: Deploy to Tencent CloudBase
on:
  push:
    branches: [main]
  schedule:
    - cron: "47 3 * * *" # 每天 UTC 03:47 (北京 11:47) 重新构建部署
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js static export
        run: npm run build
        env:
          NODE_ENV: production

      - name: Install CloudBase CLI
        run: npm install -g @cloudbase/cli

      - name: Login CloudBase CLI (non-interactive)
        run: tcb login --apiKeyId "$TCB_SECRET_ID" --apiKey "$TCB_SECRET_KEY"
        env:
          TCB_SECRET_ID: ${{ secrets.TCB_SECRET_ID }}
          TCB_SECRET_KEY: ${{ secrets.TCB_SECRET_KEY }}

      - name: Deploy to CloudBase Static Hosting
        run: tcb hosting deploy out -e "$TCB_ENV_ID"
        env:
          TCB_ENV_ID: ${{ secrets.TCB_ENV_ID }}

      - name: Submit URLs to IndexNow
        if: success()
        run: node scripts/indexnow-submit.mjs
