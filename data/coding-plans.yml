      - Claude Code
      - OpenClaw
      - Cline
      - Cursor
      - TraeCode
      - Kilo Code
      - Roo Code
      - Codex CLI
    highlights:
      - 模型池最全，Auto 自动调度选模型
      - 国内节点稳定，并发延迟口碑最好
      - 兼容所有主流 IDE 编码 Agent
      - 含 Embedding 向量模型，写代码同时做 RAG
    caveats:
      - 无 Harness 联网搜索
      - 无图片/视频多模态（需升级 Agent Plan）
      - 必须用 Coding Plan 专属 API Key
    officialUrl: https://www.volcengine.com/product/ark
