          - "需要 API 调用：腾讯云活动档明确禁止，去看百炼 Token Plan"
          - "怕忘记取消的人：低价订阅引流到期自动按原价续费，留意日历提醒"
      - heading: "到期后的最优迁移路径"
        paragraphs:
