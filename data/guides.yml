  # ============ 2. 最便宜 Coding Plan ============
  - id: cheapest-coding-plan-2026
    title: "2026 国内最便宜的 AI 编程订阅是哪个？10 款 Coding Plan 价格对比"
    description: "按入门价排序的 10 款国产 Coding Plan：腾讯云首月 7.9 元、MiniMax 29 元、小米 39 元、火山方舟 40 元。长期性价比首选火山 Lite。"
    date: "2026-10-20"
    updated: "2026-10-20"
    conclusion: "只看首月：腾讯云 7.9 元最便宜但第三个月起恢复 40 元；看长期常规价：MiniMax Starter 29 元最低但只有 M2.7 一款模型系。综合性价比最突出的是火山方舟 Coding Plan Lite——40 元/月给 5 款 SOTA 模型自由切换 + 国内稳定节点，是长期使用的稳妥选择。"
    tags: ["价格", "性价比", "Coding Plan"]
    sections:
      - heading: "10 款 Coding Plan 入门价总表（按价格排序）"
        table:
          caption: "数据核验于 2026-10-19，来自各厂商官方定价页；首月价与常规续费价分别列出。"
          headers: ["套餐", "厂商", "入门价格", "限额口径", "模型数"]
          rows:
            - ["Coding Plan Lite", "腾讯云", "首月 7.9 元，次月 20 元，第三月起 40 元", "1200 次请求/5h；9000 次/周；18000 次/月", "4 款"]
            - ["Token Plan Starter", "MiniMax", "29 元/月", "100 prompts/5h", "3 款（M2.7 系）"]
            - ["MiMo Coding Plan Lite", "小米", "39 元/月（首购 34.32 元）", "6000 万 Credits/月", "8 款"]
            - ["Coding Plan Lite", "火山方舟", "40 元/月", "5 小时动态刷新 + 月度总额度", "5 款"]
            - ["Code Plan Andante", "Kimi", "49 元/月（年付折合 39 元/月）", "300–1200 次调用/5h，每 7 天刷新", "1 款（K2.5）"]
            - ["GLM Coding Plan Lite", "智谱", "118 元/月", "约 80 prompts/5h；约 400/周", "3 款（GLM 全系）"]
            - ["Token Plan Max", "MiniMax", "119 元/月", "1000 prompts/5h", "3 款（M2.7 系）"]
            - ["Coding Plan Pro", "百炼", "200 元/月（每日限量抢购）", "1200 次/5h；9000/周；18000/月", "3 款"]
            - ["Coding Plan Pro", "火山方舟", "200 元/月", "5 倍 Lite 用量", "5 款"]
            - ["GLM Coding Plan Pro", "智谱", "538 元/月", "约 400 prompts/5h；约 2000/周", "3 款（GLM 全系）"]
      - heading: "低价档（29–49 元）逐个说"
        bullets:
          - "腾讯云 7.9 元首月：4 款模型（混元 HY 2.0、GLM-5、Kimi-K2.5、MiniMax-M2.7），额度给得不小，但它是引流价，第三月起 40 元，且不支持退订退款"
          - "MiniMax Starter 29 元：常规价最低，100+ TPS 极速推理是亮点，但模型池锁死 M2.7 系列，100 prompts/5h 只够轻度使用"
          - "小米 MiMo 39 元：8 款 MiMo 模型 + 夜间 8 折，月额度按 Credits 计，新选手价格激进，生态成熟度待观察"
          - "火山方舟 Lite 40 元：只比最低价贵 11 元，模型池直接拉到 5 款且包含豆包 Seed、DeepSeek、GLM、Kimi、MiniMax，Auto 模式还能自动调度——这 11 元差价是全站最值得花的"
          - "Kimi Andante 49 元：K2.5 长上下文 + 会员权益，年付 39 元/月，只推荐 Kimi 重度用户"
      - heading: "别只比月费：限额口径完全不同"
        paragraphs:
          - "这张表里最便宜的几个套餐，计量单位根本不一样：MiniMax/Kimi 按 5 小时 prompts 数限流，小米和腾讯按月度 Credits/请求总量，火山用动态刷新 + 月度总额度。prompts、请求次数、Credits、Tokens 之间不能硬换算。"
          - "同样花 40 元，火山可以在 5 款模型之间按任务切换（写业务逻辑用豆包 Seed，跑批量用 DeepSeek V4 Flash），单模型套餐遇到模型不擅长的任务时没有备选。"
      - heading: "购买建议"
        bullets:
          - "只想花不到 10 块钱体验一个月：腾讯云首月 7.9 元"
          - "长期主力、看重模型阵容与稳定性：火山方舟 Coding Plan Lite 40 元，本站最推荐"
          - "重度 GLM 长链路 Agent 用户：智谱 Lite 118 元（非高峰积分 5 折）"
          - "百炼 Coding Plan 200 元还要抢名额，不推荐首选；要百炼生态就买它的 Token Plan"
    faqs:
      - question: "2026 年最便宜的 AI 编程订阅到底是哪个？"
        answer: "按首月价格是腾讯云 Coding Plan Lite（7.9 元），按长期常规月费是 MiniMax Token Plan Starter（29 元/月）。但综合模型数量、稳定性和限额，40 元/月的火山方舟 Coding Plan Lite 是性价比第一，5 款模型自由切换，多花的 11 元换来的是整个模型池。"
      - question: "首月低价到期后会自动涨价吗？"
        answer: "会。腾讯云是首月 7.9 元、次月 20 元、第三月起 40 元；小米首购 34.32 元、续费 39 元。下单前要看清续费价，本站表格已把首月价和常规价分行列出。"
      - question: "为什么不直接买 29 元的 MiniMax？"
        answer: "可以买，如果你只认 MiniMax M2.7 且每天用量很轻（100 prompts/5h）。但它的模型池只有 M2.7 系列三款，遇到模型不擅长的任务没有备选；火山 40 元档多一款 DeepSeek、GLM、Kimi 和豆包 Seed，切换空间大得多。"
      - question: "有没有免费的 AI 编程套餐？"
        answer: "没有长期免费的正规包月套餐，但有低价入口：腾讯云首月 7.9 元、火山方舟促销期首月约 8.91 元、小米首购 34.32 元；OpenRouter、OpenCode Zen 提供免费模型路由。免费额度通常不稳定，不建议作为主力。"
      - question: "价格会经常变动吗？"
        answer: "会，2026 年这个赛道价格战激烈，促销档位和首月价变化频繁。本站每 4 小时自动比对官方页面指纹，表格数据均标注核验日期，下单前请以厂商结算页为准。"
    relatedProductIds: ["volcengine", "tencent", "minimax", "xiaomi", "kimi"]
    relatedLinks:
      - { label: "全部 Coding Plan 对比", href: "/coding-plan/" }
      - { label: "完整对比表", href: "/compare/" }
