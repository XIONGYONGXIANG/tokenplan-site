        answer: "包月套餐到期不续费即停止，多数平台不支持中途退款（腾讯云活动档明确不支持退订），所以建议按月买、别一上来囤年费。Kimi 年付折合 39 元/月更便宜，适合确定长期用的人。"
      - question: "AI 写代码会不会被公司或社区处罚？"
        answer: "套餐本身提供的是合法授权的模型调用；需要注意的是你所在公司的代码规范和开源协议——不要把保密代码外传、不要直接照搬许可证不兼容的生成代码。工具合规，用法也要合规。"
