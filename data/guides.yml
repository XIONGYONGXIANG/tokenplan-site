  # ============ 3. 火山 Coding Plan 评测 ============
  - id: volcengine-coding-plan-review
    title: "火山方舟 Coding Plan 值不值得买？2026 评测（Lite/Pro 怎么选）"
    description: "火山方舟 Coding Plan Lite 40 元、Pro 200 元深度评测：5 款模型池、10+ 编码工具兼容、5 小时动态限额、含 Embedding，附 Lite 与 Pro 选择建议。"
    date: "2026-10-20"
    updated: "2026-10-20"
    conclusion: "值。火山方舟是当前 SOTA 模型性价比最突出的 MaaS 平台：Lite 40 元/月给 5 款模型自由切换 + 国内稳定节点，Pro 200 元/月给 5 倍 Lite 用量，是 40 元档短板最少的 Coding Plan；90% 的人买 Lite 就够用，重度 Agent 化编程再上 Pro。"
    tags: ["火山方舟", "评测", "Coding Plan"]
    sections:
      - heading: "Lite 和 Pro 参数对比"
        table:
          headers: ["维度", "Lite", "Pro"]
          rows:
            - ["月费", "40 元/月", "200 元/月"]
            - ["用量", "5 小时动态刷新 + 月度总额度", "5 倍 Lite 用量"]
            - ["模型池", "豆包 Seed、DeepSeek V4 Flash、GLM、Kimi、MiniMax", "同款 5 款"]
            - ["调度方式", "手动切换 + Auto 智能调度", "手动切换 + Auto 智能调度"]
            - ["兼容工具", "Claude Code、OpenClaw、Cline、Cursor、TraeCode、Kilo Code、Roo Code、Codex CLI 等 10+", "主流编码工具"]
            - ["附加能力", "含 Embedding 向量模型，可同时做 RAG", "含 Embedding"]
            - ["适合人群", "日常开发、个人开发者", "大规模重构、长时间 Agent 挂机"]
      - heading: "模型池：一个月费，五条技术路线"
        paragraphs:
          - "火山 Coding Plan 最大的卖点是模型池最全：豆包 Seed（字节自研，综合均衡）、DeepSeek V4 Flash（便宜快、适合批量）、GLM（长链路编码 Agent）、Kimi（长上下文）、MiniMax（快速推理）。"
          - "Auto 模式会根据任务类型自动调度模型，不需要自己判断该用谁，这对新手极其友好。"
      - heading: "兼容工具：10+ 编码客户端全覆盖"
        paragraphs:
          - "官方兼容列表包含 Claude Code、OpenClaw、Cline、Cursor、TraeCode、Kilo Code、Roo Code、Codex CLI 等 10 余款工具，换客户端不用换订阅。"
      - heading: "四个实打实的亮点"
        bullets:
          - "国内节点，并发延迟口碑最好，晚高峰也相对稳"
          - "模型池 5 款且支持 Auto 自动调度，同类套餐要么单模型、要么要抢名额"
          - "兼容几乎所有主流 IDE 编码 Agent，迁移成本为零"
          - "自带 Embedding 向量模型，写代码的同时能搭 RAG 原型，不用另买"
      - heading: "三个要提前知道的限制"
        bullets:
          - "没有 Harness 联网搜索——需要联网请买 Agent Plan"
          - "没有图片/视频多模态——同样要上 Agent Plan"
          - "必须使用 Coding Plan 专属 API Key，和方舟普通按量 Key 不通用"
      - heading: "Lite 还是 Pro？"
        bullets:
          - "每天写代码 2–4 小时、偶尔让 Agent 跑任务：Lite 40 元，90% 的人"
          - "全天 Agent 驱动、经常多文件重构：Pro 200 元（5 倍用量）"
          - "需要联网搜索/多模态：不在 Coding Plan 里加钱，直接另开 Agent Plan Medium"
    faqs:
      - question: "火山方舟 Coding Plan 真的值 40 元吗？"
        answer: "值。同价位的 MiniMax 29 元只有 M2.7 系列、小米 39 元生态尚新，火山 40 元给的是豆包 Seed、DeepSeek、GLM、Kimi、MiniMax 五款模型 + Auto 调度 + 国内稳定节点，是当前 40 元档唯一没有明显短板的选择。"
      - question: "Lite 和 Pro 怎么选？"
        answer: "先买 Lite。Pro 200 元主要是 5 倍用量，模型池完全相同。只有当你频繁在 5 小时窗口内被限速、每天长时间让编码 Agent 自动跑任务时，升级 Pro 才有意义。"
      - question: "支持 Claude Code 和 Cursor 吗？"
        answer: "都支持。兼容列表还包括 OpenClaw、Cline、TraeCode、Kilo Code、Roo Code、Codex CLI 等 10 余款工具，在工具里把接口端点和 Key 换成 Coding Plan 专属凭证即可。"
      - question: "能联网搜索吗？"
        answer: "Coding Plan 不能，它聚焦代码任务。需要让 Agent 联网查资料，买火山方舟 Agent Plan（Medium 200 元/月含 Harness 联网搜索，底层已升级为豆包搜索）。"
      - question: "额度用完会额外扣费吗？"
        answer: "不会自动按量扣费，触发限额后是限速/等待窗口恢复。套餐采用 5 小时动态刷新加月度总额度双重控制，属于可预期的包月消费。"
