  # ============ 8. Claude Code 国产套餐 ============
  - id: claude-code-domestic-plans
    title: "Claude Code 国内用什么订阅？兼容 Claude Code 的国产 Coding Plan 汇总"
    description: "10 款兼容 Claude Code 的国产 Coding Plan 价格与模型对比：火山方舟 40 元 5 模型最稳，智谱、百炼、腾讯、MiniMax、Kimi、小米均可接入。"
    date: "2026-10-20"
    updated: "2026-10-20"
    conclusion: "国内给 Claude Code 配后端，首推火山方舟 Coding Plan Lite：40 元/月、一个订阅可切换 5 款 SOTA 模型、国内节点晚高峰相对稳定。目前在售的 10 款国产 Coding Plan 全部标称兼容 Claude Code，差异主要在模型池、价格和限额。"
    tags: ["Claude Code", "兼容", "工具"]
    sections:
      - heading: "为什么需要国产套餐给 Claude Code"
        paragraphs:
          - "Claude Code 本身是开源免费的编码 Agent 客户端，但默认后端是 Anthropic 官方 API：需要海外网络、外币卡，且直连不稳定。国产 Coding Plan 的做法是提供兼容 Anthropic 协议的国内端点，把后端模型换成豆包、DeepSeek、GLM、Kimi 等，月费制且无需梯子。"
      - heading: "兼容 Claude Code 的套餐全表"
        table:
          headers: ["套餐", "月费", "模型池", "限额要点"]
          rows:
            - ["火山方舟 Lite", "40 元", "豆包 Seed、DeepSeek V4 Flash、GLM、Kimi、MiniMax", "5h 动态刷新 + 月度总额度"]
            - ["火山方舟 Pro", "200 元", "同上 5 款", "5 倍 Lite 用量"]
            - ["智谱 GLM Lite", "118 元", "GLM-5 / 4.7 / 4.6", "约 80 prompts/5h，夜间 5 折"]
            - ["智谱 GLM Pro", "538 元", "GLM 全系", "约 400 prompts/5h，MCP 1000 次/月"]
            - ["百炼 Coding Pro", "200 元", "Qwen 系列、GLM、Kimi", "1200 次/5h；需抢名额"]
            - ["腾讯云 Lite", "首月 7.9 → 40 元", "混元 HY 2.0、GLM-5、Kimi-K2.5、MiniMax-M2.7", "18000 次/月"]
            - ["MiniMax Starter", "29 元", "M2.7 / M2.1 / M2", "100 prompts/5h"]
            - ["MiniMax Max", "119 元", "M2.7 系列", "1000 prompts/5h"]
            - ["Kimi Andante", "49 元（年付 39）", "Kimi K2.5", "300–1200 次/5h，7 天刷新"]
            - ["小米 MiMo Lite", "39 元（首购 34.32）", "MiMo-V2.5-Pro 等 8 款", "6000 万 Credits/月，夜间 8 折"]
      - heading: "配置方式（通用思路）"
        bullets:
          - "开通套餐后拿到专属 Key 和厂商提供的 Anthropic 兼容端点"
          - "在终端设置环境变量（ANTHROPIC_BASE_URL 指向国内端点、ANTHROPIC_AUTH_TOKEN 填套餐 Key）"
          - "启动 Claude Code，发一句「你是哪个模型」确认后端已切换"
          - "具体变量名以各厂商接入文档为准，火山、智谱、百炼均提供 Claude Code 专项指引"
      - heading: "怎么选"
        bullets:
          - "不想折腾、要最稳：火山 Lite，40 元，模型多一个崩了换另一个"
          - "GLM 铁粉 / 长链路 Agent：智谱 Lite 118 元"
          - "7.9 元试水：腾讯云首月（记得第三月起 40 元）"
          - "注意智谱同一密钥不允许多设备并发，多机用户慎选"
      - heading: "和官方 Claude Max 的区别"
        paragraphs:
          - "国产套餐后端不是 Claude 模型，而是国产模型，代码风格与能力各有侧重；换来的是合法稳定的国内网络、人民币月费和不折腾的支付。多家厂商模型池里同时提供 DeepSeek/GLM/Kimi 等多种选择，可以把 Claude Code 当成一个通用前端来用。"
    faqs:
      - question: "用国产套餐还需要梯子吗？"
        answer: "不需要。端点和模型都在国内节点（火山方舟为国内环境、腾讯云/百炼同理），网络延迟低，这也是国内套餐相对官方直连最大的体验优势。"
      - question: "Claude Code 这个软件本身收费吗？"
        answer: "Claude Code 客户端本身免费开源，费用全部产生在后端模型调用上——要么付 Anthropic 官方 API，要么买国产 Coding Plan 月费。"
      - question: "数据会经过哪些模型厂商？"
        answer: "你选哪个模型就发给哪个厂商：用火山豆包 Seed 发往火山引擎，切到 GLM 则发往智谱。Auto 模式下由平台调度。涉及公司保密代码时，先确认雇主允许的模型供应商清单。"
      - question: "一个 Key 能几台电脑同时用？"
        answer: "各平台策略不同，智谱明确同一密钥不允许多设备并发；火山等平台主要靠 5 小时窗口总量约束，但共享 Key 会加速触顶。建议一人一 Key，团队多人请分别购买或走企业版。"
      - question: "这种接入方式会封号吗？"
        answer: "通过厂商官方提供的兼容端点和专属 Key 接入属于授权合作通道，不是逆向转发，正常使用没有封号问题。风险点在于把套餐 Key 违规用于线上 API 或多人共享，这类滥用才会触发风控。"
    relatedProductIds: ["volcengine", "zhipu", "aliyun", "tencent", "minimax", "kimi", "xiaomi"]
