  # ============ 4. 火山 Coding vs Agent ============
  - id: coding-plan-vs-agent-plan
    title: "火山 Coding Plan 和 Agent Plan 怎么选？40 元档差在哪"
    description: "火山方舟 Coding Plan 与 Agent Plan 对比：用途、模型、联网搜索、多模态、AFP 计费的区别，以及 Small/Medium/Large 档位选择。"
    date: "2026-10-20"
    updated: "2026-10-20"
    conclusion: "纯写代码选 Coding Plan Lite（40 元/月）；需要联网搜索、图片/视频理解、云端 Agent 自动跑任务，选 Agent Plan Medium（200 元/月，10 万 AFP）。两者不是替代关系而是分工，很多人两个一起开。"
    tags: ["火山方舟", "Agent Plan", "对比"]
    sections:
      - heading: "两条产品线一张表看清"
        table:
          headers: ["维度", "Coding Plan", "Agent Plan"]
          rows:
            - ["定位", "AI 编程包月订阅", "Agent 多步任务燃料包"]
            - ["入门档", "Lite 40 元/月", "Small 40 元/月（2 万 AFP）"]
            - ["主力档", "Pro 200 元/月（5 倍 Lite 用量）", "Medium 200 元/月（10 万 AFP）"]
            - ["重度档", "—", "Large 1000 元/月（生产级高并发）"]
            - ["模型", "豆包 Seed、DeepSeek V4 Flash、GLM、Kimi、MiniMax", "豆包 Seed 系列、DeepSeek、GLM、Kimi"]
            - ["联网搜索", "无", "有，Harness（已升级豆包搜索服务）"]
            - ["多模态", "无", "有，图片/视频理解"]
            - ["云端 Agent", "无", "有，原生 ArkClaw"]
            - ["限流", "5 小时动态刷新 + 月度总额度", "5 小时 + 周 + 月三层限额"]
      - heading: "Coding Plan 适合谁"
        bullets:
          - "每天在 Claude Code、Cursor、TraeCode 里写代码"
          - "任务边界清晰：补全、重构、写测试、读仓库"
          - "不需要 AI 自己上网查最新资料"
      - heading: "Agent Plan 适合谁"
        bullets:
          - "让 Agent 自动规划、调用工具、跨系统执行多步任务"
          - "需要实时联网检索（如抓竞品、查最新文档、监控网页变化）"
          - "要处理截图、图片、视频等多模态输入"
          - "想用 ArkClaw 在云端挂机跑任务，不占本机"
      - heading: "AFP 是什么"
        paragraphs:
          - "AFP（Agent Fuel Points）是 Agent Plan 的折算积分，不是原生 token：模型调用、联网搜索、工具调用按不同系数扣 AFP。Medium 档每月 10 万 AFP，是日常开发主力档；Small 的 2 万 AFP 适合验证原型。"
          - "Agent Plan 同时受 5 小时、周、月三层限额约束，额度当月清零。"
      - heading: "能不能只买一个"
        bullets:
          - "只写代码：只买 Coding Plan Lite，40 元搞定"
          - "只做联网 Agent 研究：只买 Agent Plan Medium"
          - "白天写代码 + 跑 RAG/自动化 Agent：两个都开，40 + 200 元，模型账号体系统一"
    faqs:
      - question: "Agent Plan 能替代 Coding Plan 写代码吗？"
        answer: "技术上 Agent Plan 也能做代码任务，但它的额度按 AFP 消耗在联网和工具调用上，纯写代码的单位成本不如 Coding Plan 划算。纯代码场景买 Coding Plan，联网多模态场景才上 Agent Plan。"
      - question: "40 元的 Agent Plan Small 够用吗？"
        answer: "Small 档每月 2 万 AFP，定位是测试和原型验证，跑几个 Demo、试通联网 Agent 工作流够用；日常持续开发建议直接 Medium（10 万 AFP，200 元/月）。"
      - question: "Harness 联网搜索是什么？"
        answer: "Harness 是火山方舟 Agent Plan 的联网检索能力，2026 年 6 月已正式升级为豆包搜索服务，支持权威来源过滤、近一天/周/月/年时间范围筛选，让 Agent 回答基于实时网页而不是只靠模型训练数据。"
      - question: "两个套餐的 Key 通用吗？"
        answer: "不通用，各自有专属凭证。Coding Plan Key 只能在编码工具内用，Agent Plan 按 AFP 扣减。好消息是都在同一个火山方舟账号下开通和管理。"
      - question: "额度当月用不完能结转吗？"
        answer: "不能，Agent Plan 的 AFP 当月清零，并且还有 5 小时和周限额在月度总额之内再限流。建议先 Small 试一个月摸清自己的 AFP 消耗速度，再决定升不升 Medium。"
