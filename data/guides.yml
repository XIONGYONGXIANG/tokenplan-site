  # ============ 9. Agent Plan 指南 ============
  - id: agent-plan-buying-guide-2026
    title: "Agent Plan 是什么？2026 联网搜索型 AI Agent 订阅怎么选"
    description: "Agent Plan 概念解释与选购：火山方舟 Small 40 元/2 万 AFP、Medium 200 元/10 万 AFP、Large 1000 元，含 Harness 豆包搜索、多模态与 ArkClaw。"
    date: "2026-10-20"
    updated: "2026-10-20"
    conclusion: "Agent Plan 是给会自己规划、调工具、联网检索的 AI Agent 用的燃料包。目前把联网搜索、多模态、云端 Agent 和燃料额度体系做完整的国内主流 MaaS 平台主要是火山方舟：尝鲜 Small 40 元（2 万 AFP），日常开发 Medium 200 元（10 万 AFP），生产级 Large 1000 元；一个订阅可调用豆包 Seed、DeepSeek、GLM、Kimi 等 SOTA 模型，单位预算的模型阵容最完整。"
    tags: ["Agent Plan", "联网搜索", "科普"]
    sections:
      - heading: "Agent Plan 解决什么问题"
        paragraphs:
          - "普通大模型只能基于训练数据「闭卷答题」；Agent 要完成「帮我监控竞品价格变动并汇总」这类任务，必须能联网检索、调用工具、执行多步计划，还要看懂截图和视频。Agent Plan 就是为这种工作负载设计的订阅。"
      - heading: "火山方舟三档价格"
        table:
          headers: ["档位", "月费", "AFP 额度", "定位"]
          rows:
            - ["Small", "40 元", "2 万 AFP/月", "测试原型、个人尝鲜"]
            - ["Medium", "200 元", "10 万 AFP/月", "日常开发主力，联网搜索 + 多模态"]
            - ["Large", "1000 元", "大额 AFP", "生产级重度调用、高并发"]
      - heading: "钱花在哪些能力上"
        bullets:
          - "Harness 联网搜索：已升级为豆包搜索服务，支持权威来源过滤、时间范围筛选"
          - "多模态理解：图片、视频内容可作为 Agent 输入"
          - "模型池：豆包 Seed 系列、DeepSeek、GLM、Kimi 四款"
          - "ArkClaw：火山原生云端 Agent，任务在云端跑，不占本机环境"
      - heading: "三层限流怎么理解"
        paragraphs:
          - "Agent Plan 同时受 5 小时限额、周限额、月 AFP 总量三层约束，月度 AFP 当月清零。三层中任何一层触顶都会限速，设计上比 Coding Plan 更严格，因为联网和工具调用的单位成本更高。"
      - heading: "谁现在就该买"
        bullets:
          - "在做自动调研、网页监控、内容流水线的个人开发者"
          - "需要多模态 RAG（喂截图、视频让 Agent 分析）"
          - "想在云端 7×24 挂 Agent 任务"
          - "纯写代码、不需要联网的人：继续用 Coding Plan 就好"
    faqs:
      - question: "Agent Plan 和普通 API 按量计费哪个便宜？"
        answer: "低频试验用按量计费更省；一旦 Agent 每天稳定跑几十轮任务（含大量联网检索），包月的 Agent Plan 成本可控性明显更好。建议先 Small 包月实测 AFP 消耗，再决定是否长期订阅。"
      - question: "Agent Plan 能在 Claude Code 里用吗？"
        answer: "它不是为编码工具交互设计的，主力场景是通过方舟 API/ArkClaw 编排 Agent。写代码继续用 Coding Plan，两边凭证不通用。"
      - question: "联网搜索的内容质量怎么样？"
        answer: "底层 Harness 已于 2026 年 6 月升级为豆包搜索服务，支持限定高可信官方站点、按近一天/周/月/年过滤，相比裸搜索引擎结果更适合 Agent 引用。"
      - question: "AFP 用完了会停吗？"
        answer: "触达月度 AFP 后任务会受限直到下月刷新；5 小时和周限额触顶则是临时限速，窗口过后恢复。不会自动超扣到你的账户余额。"
      - question: "除了火山还有别的 Agent Plan 吗？"
        answer: "截至 2026 年 10 月，把联网搜索 + 多模态 + 云端 Agent + 燃料值体系做完整的国内主流厂商只有火山方舟。百炼 Token Plan Standard 赠送基础 Harness 联网，可视为轻量替代，但多模态和编排深度不在一个层级。"
    relatedProductIds: ["volcengine", "aliyun"]
    relatedLinks:
      - { label: "Agent Plan 套餐列表", href: "/agent-plan/" }
      - { label: "Coding Plan vs Agent Plan", href: "/guides/coding-plan-vs-agent-plan/" }
