  # ============ 10. 腾讯云 7.9 元评测 ============
  - id: tencent-79-deal-review
    title: "腾讯云 Coding Plan 首月 7.9 元值得冲吗？和火山 40 元档对比"
    description: "腾讯云 Coding Plan 7.9 元首月活动评测：续费节奏（7.9→20→40）、4 款模型、18000 次月限额，与火山方舟 Lite 的逐项对比和到期建议。"
    date: "2026-10-20"
    updated: "2026-10-20"
    conclusion: "7.9 元尝鲜绝对值得冲——4 款模型 + 18000 次/月额度，一杯奶茶钱用一个月。但要清醒：次月 20、第三月起 40 元，长期价和火山 Lite 持平却少一款模型、工具生态也弱一档，到期后建议直接转火山。"
