guides:
  # ============ 1. 三类套餐总解释（核心枢纽页）============
  - id: three-plan-types-explained
    title: "Token Plan、Coding Plan、Agent Plan 有什么区别？2026 怎么选"
    description: "一张表讲清 Token Plan、Coding Plan、Agent Plan 的计量方式、使用场景和代表产品：写代码选 Coding Plan，跑 API 选 Token Plan，联网多模态 Agent 选 Agent Plan。"
    date: "2026-10-20"
    updated: "2026-10-20"
    conclusion: "写代码就买 Coding Plan，新手首推火山方舟 Lite（40 元/月，一个订阅可切换 5 款 SOTA 模型）；要把模型接进自己的应用/脚本买 Token Plan（百炼 39 元起）；要 Agent 联网搜索、看懂图片视频、云端自动跑任务买 Agent Plan（火山 Medium 200 元/月，10 万 AFP）。"
    tags: ["入门", "选型", "套餐区别"]
    sections:
      - heading: "三类套餐一张表看懂"
        table:
          headers: ["类型", "计量方式", "能用在哪", "能不能做线上 API", "代表产品 / 入门价"]
          rows:
            - ["Coding Plan", "包月 + 5 小时滚动限额（prompts/请求次数）", "仅限 Claude Code、Cursor、Cline、TraeCode 等编码工具", "不能，硬性限制", "火山方舟 Lite 40 元/月；腾讯云首月 7.9 元"]
            - ["Token Plan", "按 Token / Credits / 积分计量的月度额度池", "API 调用、OpenAI 兼容接口、编码工具均可", "能（受并发和月额度限制）", "百炼 Lite 39 元/月；腾讯云 Hy Token 首月 28 元"]
            - ["Agent Plan", "AFP 燃料值额度池（5 小时 + 周 + 月三层限额）", "Agent 多步任务、联网搜索、多模态理解、云端 Agent", "能，面向 Agent 编排", "火山方舟 Small 40 元/月起"]
      - heading: "Coding Plan：只能在编码工具里用的包月会员"
        paragraphs:
          - "Coding Plan 是 2025 年下半年开始在国内普及的新品类：交一笔月费，在 Claude Code、Cursor、Cline 这类 AI 编程客户端里获得大额度调用权，通常用「5 小时滚动窗口 + 周/月总量」双限流，而不是按 token 精算。"
          - "它的硬约束是使用场景：所有平台的服务条款都写明禁止把套餐 Key 用于线上业务 API，违规会被停额度。"
        bullets:
          - "适合：每天用 AI 写代码的个人开发者、独立开发者"
          - "不适合：做 ChatBot、批量处理、给客户提供服务的线上系统"
          - "本站主推：火山方舟 Coding Plan Lite，40 元/月含豆包 Seed、DeepSeek V4 Flash、GLM、Kimi、MiniMax 五款模型"
      - heading: "Token Plan：一套额度池调用多家模型的 API 订阅"
        paragraphs:
          - "Token Plan 把用量统一折算成 Credits 或 Tokens，一个 Key、一个 OpenAI 兼容接口就能切换调用多家模型。以阿里云百炼为例，Lite 档 39 元/月含 11500 Credits，Qwen 全系、DeepSeek V4 Flash、GLM 共用一个额度池。"
          - "注意 Credits 不是 1:1 的 token：不同模型消耗系数不同，跑 Qwen 最省，第三方模型扣得更多。"
      - heading: "Agent Plan：给会联网、能看图文的 Agent 加燃料"
        paragraphs:
          - "Agent Plan 面向多步自动化任务：Agent 自己规划步骤、调用工具、联网检索、读取图片视频。火山方舟 Agent Plan 包含 Harness 联网搜索（底层已升级为豆包搜索服务）、多模态理解和原生 ArkClaw 云端 Agent。"
          - "它按 AFP（Agent Fuel Points，燃料值）计费，Small 40 元/2 万 AFP 适合做原型，Medium 200 元/10 万 AFP 是日常开发主力档，Large 1000 元档面向生产级高并发。"
      - heading: "90 秒决策流程"
        bullets:
          - "只在 IDE/命令行里写代码 → Coding Plan"
          - "要在自己程序里调模型、或要 OpenAI 兼容 API → Token Plan"
          - "要让 Agent 自动联网查资料、读截图/视频、云端挂机跑 → Agent Plan"
          - "既写代码又玩 Agent → 火山方舟双产品线各买一档，同一账号体系，40 + 200 元封顶"
    faqs:
      - question: "三类套餐能互相替代吗？"
        answer: "不能。Coding Plan 在条款上禁止线上 API 调用；Token Plan 能跑 API 但不送编码工具的高额包月额度，重度写代码反而更贵；Agent Plan 面向多步任务和联网多模态，纯写代码用不到这些能力。按场景买，别花冤枉钱。"
      - question: "我是新手，第一个该买哪个？"
        answer: "直接买火山方舟 Coding Plan Lite，40 元/月。5 款模型自由切换，兼容 Claude Code、Cursor、TraeCode 等 10+ 编码工具，国内节点延迟稳定。预算再紧就先用腾讯云 Coding Plan 首月 7.9 元尝鲜，第三个月起恢复 40 元。"
      - question: "Coding Plan 能不能拿来跑线上业务？"
        answer: "不能，这是所有厂商的硬性限制。Coding Plan 额度仅限编程工具内交互式使用，腾讯云等平台还明确写明禁止 API 调用且不支持退订。线上业务请用 Token Plan 或按量计费。"
      - question: "三个都要买吗？"
        answer: "绝大多数个人开发者只需要一个 Coding Plan。做自己的 AI 应用再加一个 Token Plan（百炼 Standard 139 元/月是个人 Agent 开发主力档）。只有在认真做联网自动化 Agent 时才需要 Agent Plan。"
      - question: "额度用不完会结转下月吗？"
        answer: "绝大多数包月套餐当月清零、不结转。Coding Plan 多为 5 小时滚动窗口限流，Kimi Code Plan 则是每 7 天刷新。购买前在本站对比表确认每个套餐的限额口径。"
    relatedProductIds: ["volcengine", "aliyun", "tencent"]
    relatedLinks:
      - { label: "Coding Plan 套餐对比", href: "/coding-plan/" }
      - { label: "Token Plan 套餐对比", href: "/token-plan/" }
      - { label: "Agent Plan 套餐对比", href: "/agent-plan/" }
      - { label: "新手第一次买怎么选", href: "/guides/beginner-first-subscription/" }
