  # ============ 5. 5 小时限额解释 ============
  - id: five-hour-limit-explained
    title: "Coding Plan 的 5 小时限额是什么意思？用不完会清零吗"
    description: "解释 Coding Plan 普遍采用的 5 小时滚动窗口限流：各平台口径（prompts/请求次数）、与周月额度的关系、超限表现及省额度技巧。"
    date: "2026-10-20"
    updated: "2026-10-20"
    conclusion: "5 小时限额是滚动窗口限流：任意连续 5 小时内用量有上限，额度随时间滑动恢复，不是每天定点重置；它和月度总额度是两道独立的闸，任一触顶都会限速。绝大多数套餐月度额度当月清零、不结转。"
    tags: ["限额", "科普", "Coding Plan"]
    sections:
      - heading: "各家 5 小时限额口径对比"
        table:
          headers: ["套餐", "5 小时窗口", "周限额", "月限额"]
          rows:
            - ["智谱 GLM Lite", "约 80 prompts", "约 400", "—"]
            - ["智谱 GLM Pro", "约 400 prompts", "约 2000", "—"]
            - ["百炼 Coding Pro", "1200 次请求", "9000 次", "18000 次"]
            - ["腾讯云 Lite", "1200 次请求", "9000 次", "18000 次"]
            - ["MiniMax Starter", "100 prompts", "—", "—"]
            - ["MiniMax Max", "1000 prompts", "—", "—"]
            - ["Kimi Andante", "300–1200 次 API 调用", "每 7 天刷新（非自然周）", "—"]
            - ["火山方舟 Lite/Pro", "动态刷新（不公开固定次数）", "—", "月度总额度"]
            - ["小米 MiMo Lite", "—", "—", "6000 万 Credits/月"]
      - heading: "滚动窗口怎么工作"
        paragraphs:
          - "假设限额是 100 prompts/5h：你在 10:00 用了 60 次、11:00 用了 40 次，那么 14:30 时 10:00 的用量开始滑出窗口，额度逐步释放，到 16:00 完全恢复。窗口永远在滑动，不存在「半夜 12 点统一重置」。"
          - "火山方舟采用动态刷新策略，不承诺固定次数：高峰期窗口配额可能收紧，低谷期更宽松，配合 Auto 模式把任务分给更空闲的模型。"
      - heading: "触顶后会发生什么"
        bullets:
          - "主流做法是限速或排队（如百炼高峰排队），不会自动扣你账户余额"
          - "Kimi 的额度每 7 天刷新一次且不累积"
          - "智谱非高峰时段积分 5 折抵扣，等于夜间额度翻倍"
          - "把 Coding Plan Key 用于线上 API 属于违规，触发风控可能直接停额度"
      - heading: "省额度的 4 个实用技巧"
        bullets:
          - "批量重活切到便宜快模型：DeepSeek V4 Flash 类模型处理机械任务，旗舰模型留给难题"
          - "用好非高峰折扣：智谱 5 折、小米夜间 8 折，大重构排到夜间跑"
          - "缩小上下文：别把整个仓库塞进去，精准给文件，prompt 消耗直接下降"
          - "一个窗口内别并行多个 Agent 会话，串行做能避免瞬间触顶"
    faqs:
      - question: "5 小时限额是每天凌晨重置吗？"
        answer: "不是。它是滚动窗口：从当前时刻往前看 5 小时的累计用量，额度随时间连续释放，任何时刻都可能恢复一部分，没有固定重置点。"
      - question: "月度额度用不完会转到下个月吗？"
        answer: "绝大多数不会，包月额度当月清零。Coding Plan 卖的是窗口期使用权而不是储值额度。唯一例外感的是 Kimi，它按每 7 天刷新，但同样不累积。"
      - question: "prompts、请求次数、Credits 是一回事吗？"
        answer: "不是。一次 prompt 可能包含多轮模型请求；百炼/腾讯按「请求次数」计；小米按 Credits（模型相关的折算积分）；火山按动态策略。不同计量单位不能横向硬换算，只能在同平台内比较档位。"
      - question: "被限速了要不要加钱升级？"
        answer: "先观察频率：如果只是偶尔高峰触顶，等窗口恢复即可；如果工作流天天撞墙，再升级（如火山 Lite→Pro 是 5 倍用量，智谱 Lite→Pro 是 5 倍 prompts）。也可以把夜间重活利用 5 折/8 折时段完成。"
      - question: "为什么火山不公开具体次数？"
        answer: "火山方舟用动态刷新 + Auto 调度，配额随实时负载和所选模型浮动，官方只承诺 5 小时窗口加月度总额度的双重控制。好处是低谷期实际可用量往往比固定档位更宽松，代价是数字不透明，重度用户建议先用 Lite 实测一周。"
    relatedProductIds: ["volcengine", "zhipu", "aliyun", "kimi"]
    relatedLinks:
      - { label: "完整套餐对比表", href: "/compare/" }
      - { label: "Coding Plan 套餐列表", href: "/coding-plan/" }
    sources:
      - { label: "火山引擎方舟", url: "https://www.volcengine.com/product/ark" }
      - { label: "智谱 AI 官网", url: "https://www.zhipuai.cn/" }

  # ============ 6. 百炼 Token Plan 购买指南 ============
  - id: bailian-token-plan-guide
    title: "百炼 Token Plan 怎么买？Credits 怎么算（Lite/Standard 选择）"
    description: "阿里云百炼 Token Plan 购买与使用指南：Lite 39 元 11500 Credits、Standard 139 元 45000 Credits，含地域、专属 Key、双限额和 Credits 消耗系数说明。"
    date: "2026-10-20"
    updated: "2026-10-20"
    conclusion: "尝鲜买 Lite 39 元/月（11500 Credits），认真做个人 Agent 应用直接 Standard 139 元/月（45000 Credits，送 Harness 联网、并发 3–4）。两个硬前提：控制台地域切到华北 2（北京），且必须用套餐专属 API Key。"
    tags: ["百炼", "Token Plan", "购买教程"]
    sections:
      - heading: "两档参数对比"
        table:
          headers: ["维度", "Lite", "Standard"]
          rows:
            - ["月费", "39 元（限时价）", "139 元"]
            - ["月度 Credits", "11500", "45000"]
            - ["模型池", "Qwen 全系、DeepSeek V4 Flash、GLM", "同款"]
            - ["并发", "基础", "3–4 路并发"]
            - ["Harness 联网搜索", "无", "赠送"]
            - ["接口", "OpenAI 兼容", "OpenAI 兼容"]
            - ["限额", "7 天滚动 + 月度双限额", "7 天滚动 + 月度双限额"]
      - heading: "Credits 到底怎么扣"
        paragraphs:
          - "Credits 不是 1:1 的 token，而是按模型设消耗系数的折算积分：跑 Qwen 全系最划算，调用 DeepSeek、GLM 等第三方模型扣得更多；图像、视频、TTS、联网调用也统一扣 Credits。"
          - "这意味着同样 11500 Credits，全用 Qwen 能跑的量明显高于混用第三方模型，做预算时要按你的主力模型估算。"
      - heading: "购买五步"
        bullets:
          - "登录阿里云百炼控制台"
          - "左上角地域切换到华北 2（北京）——其他地域看不到 Token Plan 入口"
          - "在菜单中找到 Token Plan，选 Lite 或 Standard，完成实名认证与支付"
          - "生成套餐专属 API Key（关键：普通百炼 Key 不扣套餐额度）"
          - "把应用 base_url 指向百炼 OpenAI 兼容端点，填入专属 Key 即可调用"
      - heading: "适合谁，不适合谁"
        bullets:
          - "适合：个人开发者做 AI 应用原型、多模型想共用一个额度池、重度 Qwen 用户"
          - "适合：需要把模型接进线上服务（Token Plan 允许 API 调用，和 Coding Plan 不同）"
          - "不适合：只想在 Claude Code 里写代码——那该买 Coding Plan"
          - "不适合：企业级高并发生产——个人版有并发和月度封顶，应走企业合同"
      - heading: "和火山方舟怎么取舍"
        paragraphs:
          - "要 Qwen 生态、要 OpenAI 兼容 API 做应用：百炼 Token Plan。"
          - "要在编码工具里高强度写代码、要最稳的国内节点：火山 Coding Plan。"
          - "要联网 Agent 与多模态：火山 Agent Plan（百炼 Standard 虽送 Harness，但 Agent 编排与多模态深度不如火山专线）。"
    faqs:
      - question: "百炼 Token Plan 在哪里开通？"
        answer: "登录阿里云百炼控制台，先把左上角地域切到华北 2（北京），菜单里才会出现 Token Plan 入口，选择 Lite（39 元）或 Standard（139 元）实名支付即可。"
      - question: "为什么我买了套餐但额度没扣？"
        answer: "99% 是用错 Key：必须使用 Token Plan 套餐专属 API Key，普通百炼按量计费 Key 不会扣套餐额度，而是直接走余额扣费。生成专属 Key 后替换到应用里再验证。"
      - question: "11500 Credits 大概能用多久？"
        answer: "没有固定答案，取决于模型系数：全用 Qwen 文本模型可以支撑个人项目日常开发加少量演示；混用 DeepSeek/GLM、或生成图像视频则消耗快得多。建议第一个月在控制台观察每日 Credits 曲线再决定档位。"
      - question: "Token Plan 能做线上业务吗？"
        answer: "可以，这是它和 Coding Plan 的本质区别。Token Plan 提供 OpenAI 兼容 API，允许接入自己的应用和服务，但受 7 天滚动限额与月度总量约束，突发大流量场景建议 Standard 档或叠加按量计费兜底。"
      - question: "百炼 Coding Plan 和 Token Plan 选哪个？"
        answer: "写代码选 Coding Plan 但要抢名额、供给不稳定，不推荐首选；做应用/API 选 Token Plan，随时可买、额度池多模型共用。两者都在百炼平台，但 Key 和额度体系相互独立。"
    relatedProductIds: ["aliyun"]
    relatedLinks:
      - { label: "阿里云百炼厂商页", href: "/platforms/aliyun/" }
      - { label: "Token Plan 套餐对比", href: "/token-plan/" }
      - { label: "三类套餐区别", href: "/guides/three-plan-types-explained/" }
